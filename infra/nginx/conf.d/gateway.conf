# API gateway — routes per wallet-system-design.md §5.1
#
#   /api/users/**   -> user-service:8080
#   /api/wallet/**  -> wallet-service:8080
#   /api/ledger/**  -> ledger-service:8080   (adjust when the ledger contract lands)
#
# JWTs pass through untouched; each service validates locally (design §6).

# Passive health checks at the edge (design §7) — enable these upstream blocks
# once the services join compose, and switch each location to
# `proxy_pass http://<upstream name>;`. Requires nginx >= 1.27.3 for `resolve`.
#
# upstream user_service   { zone user_service 64k;   server user-service:8080 max_fails=3 fail_timeout=10s resolve; }
# upstream wallet_service { zone wallet_service 64k; server wallet-service:8080 max_fails=3 fail_timeout=10s resolve; }
# upstream ledger_service { zone ledger_service 64k; server ledger-service:8080 max_fails=3 fail_timeout=10s resolve; }

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Docker's embedded DNS. Services don't exist in compose yet — with the
    # variable proxy_pass pattern nginx still boots cleanly and returns 502
    # per request until the upstreams appear.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # timeouts everywhere (design §7) — set once, inherited by all locations
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_read_timeout    15s;
    proxy_send_timeout    15s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;
    proxy_set_header Authorization     $http_authorization;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/users/ {
        set $backend http://user-service:8080;
        proxy_pass $backend;
    }

    location /api/wallet/ {
        set $backend http://wallet-service:8080;
        proxy_pass $backend;
    }

    location /api/ledger/ {
        set $backend http://ledger-service:8080;
        proxy_pass $backend;
    }

    location / {
        default_type text/plain;
        return 404 "not found\n";
    }
}
